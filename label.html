<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>Donkeying days</title>

  <meta
    name="description"
    content="Donkeying days">

  <link
    rel="stylesheet"
    href="style.css">

</head>

<body>

<div class="site-layout">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="sidebar-brand">
      <a href="./">
        Donkeying days
      </a>
    </div>

    <nav class="sidebar-main">

      <a href="./">
        Home
      </a>

      <a href="label.html?label=she%20donkey">
        she donkey
      </a>

      <a href="label.html?label=male%20donkey">
        male donkey
      </a>

    </nav>


    <div class="sidebar-section">

      <div class="sidebar-heading">
        Books We Read
      </div>

      <div
        id="books-list"
        class="sidebar-labels">
      </div>

    </div>


    <div class="sidebar-divider"></div>


    <div class="sidebar-section">

      <div class="sidebar-heading">
        Movies Watched
      </div>

      <div
        id="movies-list"
        class="sidebar-labels">
      </div>

    </div>

  </aside>


  <!-- MAIN CONTENT -->

  <main class="content-area">

    <section class="label-page">

      <h1 id="label-title">
        Loading…
      </h1>

      <div
        id="posts"
        class="label-posts">
      </div>

    </section>

  </main>

</div>


<script src="site-config.js"></script>


<script>

function createSidebarLinks() {

  const books =
    document.getElementById(
      "books-list"
    );

  const movies =
    document.getElementById(
      "movies-list"
    );


  books.innerHTML =
    SITE_CONFIG.books.map(
      label => createLabelLink(label)
    ).join("");


  movies.innerHTML =
    SITE_CONFIG.movies.map(
      label => createLabelLink(label)
    ).join("");

}


function createLabelLink(label) {

  return `

    <a
      class="sidebar-label"
      href="label.html?label=${encodeURIComponent(label)}">

      ${escapeHtml(label)}

    </a>

  `;

}


async function loadLabel() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const requestedLabel =
    params.get("label");


  const title =
    document.getElementById(
      "label-title"
    );

  const container =
    document.getElementById(
      "posts"
    );


  if (!requestedLabel) {

    title.textContent =
      "Stories";

    container.innerHTML =
      '<div class="error">No label specified.</div>';

    return;

  }


  title.textContent =
    "stories by " +
    requestedLabel;


  document.title =
    "stories by " +
    requestedLabel +
    " — Donkeying days";


  try {

    const response =
      await fetch("./posts.json");


    if (!response.ok) {

      throw new Error(
        "Could not load posts.json"
      );

    }


    const posts =
      await response.json();


    const wanted =
      requestedLabel
        .trim()
        .toLowerCase();


    const matching =
      posts.filter(post => {

        const labels =
          Array.isArray(post.labels)
            ? post.labels
            : [];


        return labels.some(label =>
          String(label)
            .trim()
            .toLowerCase() === wanted
        );

      });


    if (!matching.length) {

      container.innerHTML = `

        <div class="error">

          No stories were found under
          <strong>
            ${escapeHtml(requestedLabel)}
          </strong>.

        </div>

      `;

      return;

    }


    container.innerHTML =
      matching.map(post => {

        const excerpt =
          getExcerpt(
            post.content || ""
          );


        return `

          <article class="label-post">

            <div class="post-date">
              ${formatDate(
                post.published
              )}
            </div>


            <h2>

              <a
                href="stories/${encodeURIComponent(post.slug)}/">

                ${escapeHtml(
                  post.title
                )}

              </a>

            </h2>


            <p>
              ${escapeHtml(excerpt)}
            </p>


            <a
              class="read-more"
              href="stories/${encodeURIComponent(post.slug)}/">

              Read story →

            </a>

          </article>

        `;

      }).join("");


  } catch (error) {

    console.error(error);

    container.innerHTML = `

      <div class="error">

        The stories could not be loaded.

      </div>

    `;

  }

}


function getExcerpt(html) {

  const div =
    document.createElement("div");

  div.innerHTML = html;


  const text =
    (
      div.textContent ||
      div.innerText ||
      ""
    )
    .replace(/\s+/g, " ")
    .trim();


  return text.length > 280
    ? text.substring(0, 280) + "…"
    : text;

}


function formatDate(value) {

  if (!value) {
    return "";
  }


  const date =
    new Date(value);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return "";
  }


  return new Intl.DateTimeFormat(
    undefined,
    {
      year: "numeric",
      month: "long",
      day: "numeric"
    }
  ).format(date);

}


function escapeHtml(value) {

  return String(value)
    .replace(
      /[&<>"']/g,
      character => ({

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"

      }[character])
    );

}


createSidebarLinks();
loadLabel();

</script>

</body>

</html>
