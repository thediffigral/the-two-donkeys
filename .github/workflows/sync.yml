name: Sync Blogger Posts

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Get website files
        uses: actions/checkout@v4

      - name: Download Blogger posts
        run: |
          python - <<'PY'
          import json
          import re
          import html
          import urllib.request
          from pathlib import Path
          import shutil

          url = "https://thetwodonkeys.blogspot.com/feeds/posts/default?alt=json&max-results=100"

          data = json.load(urllib.request.urlopen(url))

          entries = data.get("feed", {}).get("entry", [])

          posts = []

          def slugify(text):
              text = html.unescape(text).lower()
              text = re.sub(r"[^a-z0-9]+", "-", text)
              text = text.strip("-")
              return text or "story"

          for entry in entries:
              title = entry.get("title", {}).get("$t", "Untitled")
              content = entry.get("content", {}).get("$t", "")
              published = entry.get("published", {}).get("$t", "")

              slug = slugify(title)

              posts.append({
                  "title": title,
                  "content": content,
                  "published": published,
                  "slug": slug
              })

          Path("posts.json").write_text(
              json.dumps(posts, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          stories = Path("stories")
          stories.mkdir(exist_ok=True)

          for old in stories.iterdir():
              if old.is_dir():
                  shutil.rmtree(old)

          template = Path("article.html")

          for post in posts:
              folder = stories / post["slug"]
              folder.mkdir(parents=True, exist_ok=True)

              shutil.copy(
                  template,
                  folder / "index.html"
              )

          print(f"Found {len(posts)} Blogger posts")
          print(f"Generated {len(posts)} article pages")
          PY

      - name: Save changes
        run: |
          git config user.name "Blogger Sync"
          git config user.email "actions@github.com"

          git add posts.json stories

          git diff --cached --quiet || git commit -m "Update Blogger stories"

          git push
