name: Sync Blogger Posts

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Get website files
        uses: actions/checkout@v4

      - name: Download Blogger posts and build article pages
        run: |
          python - <<'PY'
          import json
          import re
          import html
          import urllib.request
          from pathlib import Path
          import shutil

          BLOGGER_URL = "https://thetwodonkeys.blogspot.com/feeds/posts/default?alt=json&max-results=100"

          data = json.load(
              urllib.request.urlopen(BLOGGER_URL)
          )

          entries = data.get("feed", {}).get("entry", [])

          def slugify(text):
              text = html.unescape(text).lower()
              text = re.sub(r"[^a-z0-9]+", "-", text)
              text = text.strip("-")
              return text or "story"

          def normalize_label(value):
              return re.sub(
                  r"\s+",
                  " ",
                  str(value or "").strip().lower()
              )

          def story_meta(post):
              date = post["published"][:10]

              topic_labels = [
                  label
                  for label in post.get("labels", [])
                  if normalize_label(label) not in (
                      "she donkey",
                      "male donkey"
                  )
              ]

              if topic_labels:
                  topics = " and ".join(
                      html.escape(label)
                      for label in topic_labels
                  )

                  return (
                      f"Written on {date}, "
                      f"after going through "
                      f"<em>{topics}</em>."
                  )

              return f"Written on {date}"

          posts = []
          used_slugs = set()

          for entry in entries:

              title = entry.get(
                  "title", {}
              ).get("$t", "Untitled")

              content = entry.get(
                  "content", {}
              ).get("$t", "")

              published = entry.get(
                  "published", {}
              ).get("$t", "")

              slug = slugify(title)

              original_slug = slug
              number = 2

              while slug in used_slugs:
                  slug = original_slug + "-" + str(number)
                  number += 1

              used_slugs.add(slug)

              labels = []

              for category in entry.get("category", []):
                  label = category.get("term", "")

                  if label:
                      labels.append(label)

              posts.append({
                  "title": title,
                  "content": content,
                  "published": published,
                  "slug": slug,
                  "labels": labels
              })

          Path("posts.json").write_text(
              json.dumps(
                  posts,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          stories = Path("stories")

          if stories.exists():
              for item in stories.iterdir():
                  if item.is_dir():
                      shutil.rmtree(item)

          stories.mkdir(exist_ok=True)

          def make_article(post):

              title = html.escape(
                  post["title"],
                  quote=True
              )

              description = html.escape(
                  re.sub(
                      r"<[^>]+>",
                      " ",
                      post["content"]
                  )[:160],
                  quote=True
              )

              content = post["content"]

              return f"""<!doctype html>
          <html lang="en">

          <head>

            <meta charset="utf-8">

            <meta name="viewport"
                  content="width=device-width, initial-scale=1">

            <title>{title} — The Two Donkeys</title>

            <meta name="description"
                  content="{description}">

            <link rel="stylesheet"
                  href="../../style.css">

          </head>

          <body>

          <header class="site-header">

            <div class="wrap header-inner">

              <a class="brand"
                 href="../../">
                The Two Donkeys
              </a>

            </div>

          </header>

          <main class="wrap">

            <article class="article-page">

              <a class="back"
                 href="../../">
                ← Back to stories
              </a>

              <div class="article-date">
                {story_meta(post)}
              </div>

              <h1 class="article-title">
                {title}
              </h1>

              <div class="article-content">
                {content}
              </div>

            </article>

          </main>

          <footer class="site-footer">

            <div class="wrap">
              © The Two Donkeys
            </div>

          </footer>

          </body>
          </html>
          """

          for post in posts:

              folder = stories / post["slug"]

              folder.mkdir(
                  parents=True,
                  exist_ok=True
              )

              page = make_article(post)

              (folder / "index.html").write_text(
                  page,
                  encoding="utf-8"
              )

          print(
              f"Found {len(posts)} Blogger posts"
          )

          print(
              f"Generated {len(posts)} article pages"
          )
          PY

      - name: Save changes
        run: |
          git config user.name "Blogger Sync"
          git config user.email "actions@github.com"

          git add posts.json stories

          git diff --cached --quiet || \
            git commit -m "Update Blogger stories"

          git push
