name: Sync Blogger Posts

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Get website files
        uses: actions/checkout@v4

      - name: Download Blogger posts and generate pages
        run: |
          python - <<'PY'
          import json
          import re
          import html
          import urllib.request
          from pathlib import Path

          url = "https://thetwodonkeys.blogspot.com/feeds/posts/default?alt=json&max-results=100"

          data = json.load(urllib.request.urlopen(url))

          entries = data.get("feed", {}).get("entry", [])

          posts = []

          def slugify(text):
              text = html.unescape(text).lower()
              text = re.sub(r"[^a-z0-9]+", "-", text)
              text = text.strip("-")
              return text or "story"

          for index, entry in enumerate(entries):

              title = entry.get("title", {}).get("$t", "Untitled")
              content = entry.get("content", {}).get("$t", "")
              published = entry.get("published", {}).get("$t", "")

              slug = slugify(title)

              posts.append({
                  "title": title,
                  "content": content,
                  "published": published,
                  "slug": slug
              })

          Path("posts.json").write_text(
              json.dumps(posts, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          # Create article pages
          template = Path("article.html").read_text(encoding="utf-8")

          stories = Path("stories")
          stories.mkdir(exist_ok=True)

          # Remove old generated article directories
          for old in stories.iterdir():
              if old.is_dir():
                  import shutil
                  shutil.rmtree(old)

          for post in posts:

              folder = stories / post["slug"]
              folder.mkdir(parents=True, exist_ok=True)

              article = template

              article = article.replace(
                  '<script src="article.js"></script>',
                  ''
              )

              # Store post data in page
              data_script = f'''
              <script>
              window.BLOGGER_POST = {json.dumps(post, ensure_ascii=False)};
              </script>
              '''

              article = article.replace(
                  "</head>",
                  data_script + "</head>"
              )

              # Replace the existing article loader
              start = article.find("<script>")
              end = article.rfind("</script>")

              if start != -1 and end != -1:
                  new_script = f"""
<script>
const post = window.BLOGGER_POST;

document.title =
  "{html.escape(post['title'])}" + " — The Two Donkeys";

document.getElementById("content").innerHTML = `
  <div class="article-date">${{formatDate(post.published)}}</div>

  <h1 class="article-title">
    ${{escapeHtml(post.title)}}
  </h1>

  <div class="article-content">
    ${{post.content}}
  </div>

  <div class="article-nav">
    <a href="../..">← Back to all stories</a>
  </div>
`;

function formatDate(value) {{
  if (!value) return "";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) return "";

  return new Intl.DateTimeFormat(undefined, {{
    year: "numeric",
    month: "long",
    day: "numeric"
  }}).format(date);
}}

function escapeHtml(value) {{
  return String(value).replace(/[&<>"']/g, character => ({{
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }}[character]));
}}
</script>
"""

                  article = (
                      article[:start] +
                      new_script +
                      article[end + 9:]
                  )

              (folder / "index.html").write_text(
                  article,
                  encoding="utf-8"
              )

          print(f"Generated {len(posts)} article pages")
          PY

      - name: Update homepage links
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import html

          posts = json.loads(
              Path("posts.json").read_text(encoding="utf-8")
          )

          path = Path("script.js")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              'article.html?id=${index}',
              'stories/${posts[index].slug}/'
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Save changes
        run: |
          git config user.name "Blogger Sync"
          git config user.email "actions@github.com"

          git add posts.json stories script.js

          git diff --cached --quiet || \
            git commit -m "Update Blogger stories"

          git push
