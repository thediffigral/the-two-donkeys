<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>Donkeying days</title>

  <meta
    name="description"
    content="two donkeys on their journey together on earth">

  <link
    rel="stylesheet"
    href="style.css">

</head>

<body>

<main class="home">

  <div class="home-inner">

    <h1 class="site-title">
      donkeying days
    </h1>

    <p class="site-description">
      two donkeys on their journey together on earth
    </p>


    <!-- TABS -->

    
  <!-- BOOKS -->

<section class="collection-section">

  <div class="collection-heading">
    <p class="collection-label">BOOKS</p>

    <h2>Books we have read</h2>
  </div>

  <div
    id="books-grid"
    class="collection-grid">

    <div class="loading">
      Loading books…
    </div>

  </div>

</section>
  <!-- MOVIES -->

<section class="collection-section">

  <div class="collection-heading">
    <p class="collection-label">MOVIES</p>

    <h2>Movies we watched</h2>
  </div>

  <div
    id="movies-grid"
    class="collection-grid movie-grid">

    <div class="loading">
      Loading movies…
    </div>

  </div>

</section>
    <!-- POSTS -->

    <section
      id="homepage-posts"
      class="homepage-posts">

      <div class="loading">
        Loading stories…
      </div>

    </section>


  </div>

</main>
  
<div
  class="story-tabs"
  role="tablist">

  <button
    class="story-tab active"
    data-filter="she donkey"
    role="tab">

    she donkey writes here

  </button>

  <button
    class="story-tab"
    data-filter="male donkey"
    role="tab">

    male donkey writes here

  </button>

  <button
    class="story-tab"
    data-filter="all"
    role="tab">

    all stories

  </button>

</div>


<footer class="home-footer">

<footer class="home-footer">

  © Donkeying days

</footer>


<script>

let allPosts = [];

  const books = [

  {
    label: "Days at the Morisaki Bookshop - Satoshi Yagisawa",
    title: "Days at the Morisaki Bookshop",
    author: "Satoshi Yagisawa"
  },

  {
    label: "Gene Machine - Venki Ramakrishnan",
    title: "Gene Machine",
    author: "Venki Ramakrishnan"
  },

  {
    label: "Heart Lamp - Banu Mushtaq",
    title: "Heart Lamp",
    author: "Banu Mushtaq"
  },

  {
    label: "Sister of My Heart - Chitra Banerjee",
    title: "Sister of My Heart",
    author: "Chitra Banerjee"
  },

  {
    label: "The Anarchy - William Dalrymple",
    title: "The Anarchy",
    author: "William Dalrymple"
  },

  {
    label: "The Forest of Enchantments - Chitra Banerjee",
    title: "The Forest of Enchantments",
    author: "Chitra Banerjee"
  },

  {
    label: "The Other Side of Silence - Urvashi Butalia",
    title: "The Other Side of Silence",
    author: "Urvashi Butalia"
  },

  {
    label: "The Owl and the River and the Valley - Arupa Patangia Kalita",
    title: "The Owl and the River and the Valley",
    author: "Arupa Patangia Kalita"
  },

  {
    label: "The Village By The Sea - Anita Desai",
    title: "The Village By The Sea",
    author: "Anita Desai"
  }

];

  const movies = [

  {
    label: "Musafir cafe",
    title: "Musafir cafe"
  },

  {
    label: "Thappad",
    title: "Thappad"
  },

  {
    label: "The Odyssey",
    title: "The Odyssey"
  }

];
/* -------------------------
   LOAD POSTS
------------------------- */

async function loadPosts() {

  const container =
    document.getElementById(
      "homepage-posts"
    );


  try {

    const response =
      await fetch("./posts.json");


    if (!response.ok) {

      throw new Error(
        "Could not load posts.json"
      );

    }


    allPosts =
      await response.json();

    showBooks();
    showMovies();
    showPosts("she donkey");


  } catch (error) {

    console.error(error);

    container.innerHTML = `

      <div class="error">

        The stories could not be loaded.

      </div>

    `;

  }

}

/* -------------------------
   SHOW BOOKS
------------------------- */

function showBooks() {

  const container =
    document.getElementById("books-grid");

  if (!container) return;

  container.innerHTML =
    books.map(book => {

      const encodedLabel =
        encodeURIComponent(book.label);

      return `

        <article
          class="collection-card book-card"
          data-label="${escapeHtml(book.label)}">

          <div class="book-cover">

            <img
              src="https://covers.openlibrary.org/b/title/${encodeURIComponent(book.title)}-L.jpg"
              alt="${escapeHtml(book.title)} cover"
              loading="lazy"
              onerror="this.parentElement.classList.add('no-cover'); this.style.display='none';"
            >

          </div>

          <div class="collection-card-content">

            <h3>
              ${escapeHtml(book.title)}
            </h3>

            <p>
              ${escapeHtml(book.author)}
            </p>

            <button
              class="collection-link"
              type="button"
              onclick="showBookStories('${encodedLabel}')">

              Read our stories →

            </button>

          </div>

        </article>

      `;

    }).join("");

}

  function showMovies() {

  const container =
    document.getElementById("movies-grid");

  if (!container) return;

  container.innerHTML =
    movies.map(movie => {

      const encodedLabel =
        encodeURIComponent(movie.label);

      return `

        <article
          class="collection-card movie-card">

          <div class="movie-poster">

            <div class="movie-poster-title">
              ${escapeHtml(movie.title)}
            </div>

          </div>

          <div class="collection-card-content">

            <h3>
              ${escapeHtml(movie.title)}
            </h3>

            <button
              class="collection-link"
              type="button"
              onclick="showMovieStories('${encodedLabel}')">

              Read our stories →

            </button>

          </div>

        </article>

      `;

    }).join("");

}

  function showMovieStories(encodedLabel) {

  const label =
    decodeURIComponent(encodedLabel);

  showPosts(label);

  const stories =
    document.getElementById("homepage-posts");

  if (stories) {

    stories.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  }

}

  function showBookStories(encodedLabel) {

  const label =
    decodeURIComponent(encodedLabel);

  showPosts(label);

  const stories =
    document.getElementById("homepage-posts");

  if (stories) {

    stories.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  }

}
/* -------------------------
   SHOW POSTS
------------------------- */

function showPosts(filter) {

  const container =
    document.getElementById(
      "homepage-posts"
    );


  let posts;


  if (filter === "all") {

    posts = allPosts;

  } else {

    posts =
      allPosts.filter(post => {

        const labels =
          Array.isArray(post.labels)
            ? post.labels
            : [];


        return labels.some(label =>
          normalizeLabel(label) ===
          normalizeLabel(filter)
        );

      });

  }


  if (!posts.length) {

    container.innerHTML = `

      <div class="error">

        No stories found.

      </div>

    `;

    return;

  }


  container.innerHTML =
    posts.map(post => {

      const excerpt =
        getExcerpt(
          post.content || ""
        );


      return `

        <article class="homepage-post">

          <div class="post-date">
            ${formatDate(
              post.published
            )}
          </div>


          <h2>

            <a
              href="stories/${encodeURIComponent(post.slug)}/">

              ${escapeHtml(
                post.title
              )}

            </a>

          </h2>


          <p>
            ${escapeHtml(excerpt)}
          </p>


          <a
            class="read-more"
            href="stories/${encodeURIComponent(post.slug)}/">

            Read story →

          </a>

        </article>

      `;

    }).join("");

}


/* -------------------------
   TAB CLICKING
------------------------- */

document
  .querySelectorAll(".story-tab")
  .forEach(tab => {

    tab.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(".story-tab")
          .forEach(item => {

            item.classList.remove(
              "active"
            );

          });


        tab.classList.add(
          "active"
        );


        const filter =
          tab.dataset.filter;


        showPosts(filter);

      }
    );

  });


/* -------------------------
   HELPERS
------------------------- */

function normalizeLabel(value) {

  return String(value || "")
    .toLowerCase()
    .replace(/[–—−]/g, "-")
    .replace(/\s*-\s*/g, "-")
    .replace(/\s+/g, " ")
    .trim();

}


function getExcerpt(html) {

  const div =
    document.createElement("div");

  div.innerHTML = html;


  const text =
    (
      div.textContent ||
      div.innerText ||
      ""
    )
    .replace(/\s+/g, " ")
    .trim();


  return text.length > 220
    ? text.substring(0, 220) + "…"
    : text;

}


function formatDate(value) {

  if (!value) return "";


  const date =
    new Date(value);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return "";

  }


  return new Intl.DateTimeFormat(
    undefined,
    {
      year: "numeric",
      month: "long",
      day: "numeric"
    }
  ).format(date);

}


function escapeHtml(value) {

  return String(value)
    .replace(
      /[&<>"']/g,
      character => ({

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"

      }[character])
    );

}


loadPosts();

</script>
  <button
  id="back-to-top"
  class="back-to-top"
  aria-label="Back to top">

  ↑

</button>
<script>

const backToTop =
  document.getElementById(
    "back-to-top"
  );


window.addEventListener(
  "scroll",
  () => {

    if (window.scrollY > 500) {

      backToTop.classList.add(
        "visible"
      );

    } else {

      backToTop.classList.remove(
        "visible"
      );

    }

  }
);


backToTop.addEventListener(
  "click",
  () => {

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }
);

</script>
</body>

</html>
