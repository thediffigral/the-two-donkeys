<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>The Two Donkeys</title>

  <meta name="description" content="The Two Donkeys">

  <link rel="stylesheet" href="../../style.css">
</head>

<body>

<header class="site-header">
  <div class="wrap header-inner">

    <a class="brand" href="../../">
      The Two Donkeys
    </a>

    <nav>
      <!--<a href="../../">Home</a>
      <a href="../../#about">About</a> -->
    </nav>

  </div>
</header>

<main class="wrap">

  <article class="article-page">

    <a class="back" href="../../">
      <!-- ← Back to stories -->
    </a>

    <div id="content">
      Loading story…
    </div>

  </article>

</main>

<footer class="site-footer">

  <div class="wrap">
    © The Two Donkeys
  </div>

</footer>

<script>

async function loadArticle() {

  const container = document.getElementById("content");

  try {

    const response = await fetch("../../posts.json");

    if (!response.ok) {
      throw new Error("Could not load posts.");
    }

    const posts = await response.json();

    const path = window.location.pathname;

    const parts = path.split("/").filter(Boolean);

    const slug = parts[parts.length - 1];

    const post = posts.find(
      item => item.slug === slug
    );

    if (!post) {

      container.innerHTML =
        '<div class="error">Story not found.</div>';

      return;
    }

    document.title =
      post.title + " — The Two Donkeys";

    container.innerHTML = `

      <div class="article-date">
        ${getStoryMeta(post)}
      </div>

      <h1 class="article-title">
        ${escapeHtml(post.title)}
      </h1>

      <div class="article-content">
        ${post.content}
      </div>

      <div class="article-nav">

        <a href="../../">
          ← Back to all stories
        </a>

      </div>

    `;

  } catch (error) {

    console.error(error);

    container.innerHTML =
      '<div class="error">The story could not be loaded.</div>';

  }

}
function getStoryMeta(post) {

  const date =
    formatDate(post.published);

  const labels =
    Array.isArray(post.labels)
      ? post.labels
      : [];

  const topicLabels =
    labels.filter(label => {

      const normalized =
        normalizeLabel(label);

      return (
        normalized !== "she donkey" &&
        normalized !== "male donkey"
      );

    });

  if (!date && !topicLabels.length) {
    return "";
  }

  if (!topicLabels.length) {
    return `Written on ${escapeHtml(date)}`;
  }

  const topics =
    topicLabels
      .map(label =>
        `<em>${escapeHtml(label)}</em>`
      )
      .join(" and ");

  return `Written on ${escapeHtml(date)}, after going through ${topics}.`;
}


function normalizeLabel(value) {

  return String(value || "")
    .toLowerCase()
    .replace(/[–—−]/g, "-")
    .replace(/\s*-\s*/g, "-")
    .replace(/\s+/g, " ")
    .trim();

}

function formatDate(value) {

  if (!value) return "";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) return "";

  return new Intl.DateTimeFormat(undefined, {

    year: "numeric",
    month: "long",
    day: "numeric"

  }).format(date);

}


function escapeHtml(value) {

  return String(value).replace(
    /[&<>"']/g,
    character => ({

      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"

    }[character])
  );

}


loadArticle();

</script>

</body>
</html>
