<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Two Donkeys</title>
  <meta name="description" content="The Two Donkeys">
  <link rel="stylesheet" href="style.css">

  <style>
    .article-page {
      max-width: 780px;
      margin: 0 auto;
      padding: 80px 0 100px;
    }

    .back {
      display: inline-block;
      color: var(--accent);
      text-decoration: none;
      font-size: .9rem;
      margin-bottom: 45px;
    }

    .article-date {
      color: var(--muted);
      font-size: .85rem;
      margin-bottom: 12px;
    }

    .article-title {
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: clamp(2.2rem, 5vw, 4rem);
      line-height: 1.2;
      margin: 0 0 45px;
      letter-spacing: -.025em;
    }

    .article-content {
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 1.08rem;
      line-height: 1.9;
    }

    .article-content img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 35px auto;
    }

    .article-content p {
      margin: 0 0 1.5em;
    }

    .article-content a {
      color: var(--accent);
    }

    .article-content blockquote {
      border-left: 3px solid var(--accent);
      margin: 30px 0;
      padding: 5px 25px;
      color: var(--muted);
    }

    .article-nav {
      margin-top: 70px;
      padding-top: 30px;
      border-top: 1px solid var(--line);
    }

    .article-nav a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
    }

    .error {
      padding: 35px;
      background: var(--paper);
      border: 1px solid var(--line);
      color: var(--muted);
    }
  </style>
</head>

<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="./">The Two Donkeys</a>

    <nav>
      <a href="./">Home</a>
      <a href="./#about">About</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <article class="article-page" id="article">
    <a class="back" href="./">← Back to stories</a>

    <div id="content">
      Loading story…
    </div>
  </article>
</main>

<footer class="site-footer">
  <div class="wrap">
    © The Two Donkeys
  </div>
</footer>

<script>
async function loadArticle() {

  const container = document.getElementById("content");

  const params = new URLSearchParams(window.location.search);
  const id = parseInt(params.get("id"), 10);

  if (Number.isNaN(id)) {
    container.innerHTML =
      '<div class="error">Story not found.</div>';
    return;
  }

  try {

    const response = await fetch("./posts.json");

    if (!response.ok) {
      throw new Error("Could not load posts.");
    }

    const posts = await response.json();

    if (!posts[id]) {
      container.innerHTML =
        '<div class="error">Story not found.</div>';
      return;
    }

    const post = posts[id];

    document.title =
      (post.title || "Story") + " — The Two Donkeys";

    const title = escapeHtml(post.title || "Untitled");
    const date = formatDate(post.published);

    container.innerHTML = `
      <div class="article-date">${date}</div>

      <h1 class="article-title">
        ${title}
      </h1>

      <div class="article-content">
        ${post.content || ""}
      </div>

      <div class="article-nav">
        <a href="./">← Back to all stories</a>
      </div>
    `;

  } catch (error) {

    console.error(error);

    container.innerHTML =
      '<div class="error">The story could not be loaded.</div>';
  }
}

function formatDate(value) {

  if (!value) return "";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) return "";

  return new Intl.DateTimeFormat(undefined, {
    year: "numeric",
    month: "long",
    day: "numeric"
  }).format(date);
}

function escapeHtml(value) {

  return String(value).replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[character]));
}

loadArticle();
</script>

</body>
</html>
